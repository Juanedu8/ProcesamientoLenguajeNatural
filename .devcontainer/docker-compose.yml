name: pln-clase10-n8n
services:
  dev:
    image: mcr.microsoft.com/devcontainers/python:3.11-bookworm
    volumes:
      # Codigo del repo dentro del contenedor de desarrollo
      # (el socket de Docker lo monta el feature docker-outside-of-docker,
      # no agregar /var/run/docker.sock aqui: produce "duplicate mount")
      - ..:/workspaces/ProcesamientoLenguajeNatural:cached
    command: sleep infinity
    working_dir: /workspaces/ProcesamientoLenguajeNatural

  n8n:
    image: n8nio/n8n:latest
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=0.0.0.0
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      # --- Anti "Connection lost": URLs autoconstruidas, cero edicion manual ---
      # Codespaces expone CODESPACE_NAME y GITHUB_CODESPACES_PORT_FORWARDING_DOMAIN;
      # compose las interpola al hacer up -> https://<nombre>-5678.<dominio>/
      # Cada estudiante/fork obtiene su URL real automaticamente. Solo recrear:
      #   docker compose up -d --force-recreate n8n
      # y abrir n8n SIEMPRE con la URL https de PORTS, no con localhost.
      # Uso local fuera de Codespaces: exporta N8N_EDITOR_BASE_URL y
      # N8N_WEBHOOK_URL antes del up (ej. http://localhost:5678/).
      - N8N_EDITOR_BASE_URL=${N8N_EDITOR_BASE_URL:-https://${CODESPACE_NAME}-5678.${GITHUB_CODESPACES_PORT_FORWARDING_DOMAIN}/}
      - N8N_WEBHOOK_URL=${N8N_WEBHOOK_URL:-https://${CODESPACE_NAME}-5678.${GITHUB_CODESPACES_PORT_FORWARDING_DOMAIN}/}
      - N8N_PUSH_BACKEND=sse
      - N8N_SECURE_COOKIE=false
      - GENERIC_TIMEZONE=America/Bogota
      - TZ=America/Bogota
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
    volumes:
      - n8n_data:/home/node/.n8n
      # Monta el repo (solo lectura) para que el nodo Spreadsheet File
      # pueda leer el inventario sin subirlo a mano.
      # Ruta dentro de n8n: /home/node/files/Clase 10/Inventario Laboratorio UNAL.xlsx
      - ..:/home/node/files:ro

volumes:
  n8n_data:
